name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@dc944884b137d7f6b96628189bdf041bffc27d93 # v2.2.0
    with:
      check-cmd: npm run check
      lint-cmd: npm run lint

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@dc944884b137d7f6b96628189bdf041bffc27d93 # v2.2.0
    with:
      skip: tsc,prettier,eslint # the js job runs them after npm ci
